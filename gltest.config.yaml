networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false

  # studionet is preconfigured by the gltest tool (URL + auto-generated
  # accounts); listing it as an empty dict just documents that it's
  # available. A bare "studionet:" with nothing under it is invalid YAML
  # for this schema -- it parses to `null`, and the config loader requires
  # every listed network to be a dictionary.
  studionet: {}

  # testnet_asimov and testnet_bradbury are commented out by default.
  # Uncomment and fill in real funded-account private keys (via a local
  # .env file, never committed) only when you actually need to deploy to
  # one of those testnets -- see README.md, "Local usage" step 6.
  #
  # IMPORTANT: this file is validated as a whole every time gltest/pytest
  # runs, even for `pytest tests/direct/` (fast, in-memory, mocked tests
  # that need no real credentials at all). If either block below is
  # active and its ACCOUNT_PRIVATE_KEY_* env vars aren't set, EVERY test
  # run fails at configuration time before a single test executes -- so
  # keep these commented out unless you've actually set up a .env with
  # real keys for that network.
  #
  # testnet_asimov:
  #   accounts:
  #     - "${ACCOUNT_PRIVATE_KEY_1}"
  #     - "${ACCOUNT_PRIVATE_KEY_2}"
  #   from: "${ACCOUNT_PRIVATE_KEY_1}"
  #
  # testnet_bradbury:
  #   accounts:
  #     - "${ACCOUNT_PRIVATE_KEY_1}"
  #     - "${ACCOUNT_PRIVATE_KEY_2}"
  #   from: "${ACCOUNT_PRIVATE_KEY_1}"

paths:
  contracts: "contracts"
  artifacts: "artifacts"

environment: .env
